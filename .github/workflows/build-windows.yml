name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Eki-TV-MusicPlayer-windows
          path: |
            electron/dist/*.exe

      # Kun työnkulku käynnistyy tagista (esim. v0.1.0), asennusohjelmat liitetään GitHub Releaseen
      - name: Julkaise Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.exe \
            --repo "$GITHUB_REPOSITORY" \
            --title "Eki-TV MusicPlayer $GITHUB_REF_NAME" \
            --notes "Windows-asennusohjelma (Setup) ja kannettava versio (Portable). Windows voi varoittaa tuntemattomasta julkaisijasta: valitse Lisätietoja → Suorita silti."
